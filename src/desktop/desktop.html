<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>12A3 - Quản Lí Thi Đua</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="desktop.css">
</head>
<body style="margin:0;background:#07111f">

<!-- Desktop root — JS sẽ render vào đây -->
<div id="desktop-root" class="win-root theme-dark" style="--desktop-accent:#2563eb"></div>

<script src="desktop.js"></script>
<script>
  (function boot() {
    let u;
    try { u = JSON.parse(sessionStorage.getItem('a3k64-user') || 'null'); } catch { u = null; }

    // Không có session → chuyển về trang đăng nhập
    if (!u) {
      window.location.replace('../auth/login.html');
      return;
    }

    initDesktop(u);
  })();

  window.addEventListener('a3k64-logout', () => {
    sessionStorage.removeItem('a3k64-user');
    window.location.href = '../auth/login.html';
  });
</script>
<script src="../assets/js/disable-context-menu.js"></script>
</body>
</html>
