<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-class-tpl="{class} - Quản Lí Thi Đua">Quản Lí Thi Đua</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="../assets/img/favicon.ico" />

  <!-- Preconnect GAS -->
  <link rel="preconnect" href="https://script.google.com" />
  <link rel="dns-prefetch" href="https://script.googleusercontent.com" />

  <!-- Prefetch modules hay dùng -->
  <link rel="prefetch" href="../modules/scoreboard/scoreboard-window.html" as="document" />
  <link rel="prefetch" href="../modules/scoreboard/scoreboard.js" as="script" />
  <link rel="prefetch" href="../modules/scoreboard/scoreboard.css" as="style" />

  <!-- Chỉ load CSS desktop (không kéo mobile.css) -->
  <link rel="stylesheet" href="desktop.css">
  <link rel="stylesheet" href="desktop-fx.css">
  <link rel="stylesheet" href="desktop-win11.css">
</head>
<body style="margin:0;background:#07111f">

<div id="desktop-root" class="win-root theme-dark"></div>

<!-- Config dùng chung trước -->
<script src="../assets/js/config.js"></script>
<script src="../assets/js/class-config.js"></script>
<script src="../assets/js/session.js"></script>
<script src="../assets/js/ai-proxy.js"></script>   <!-- tải trước giá + gói đang dùng ngay khi vào trang -->
<script src="../assets/js/premium-themes.js"></script>
<!-- Desktop shell -->
<script src="desktop.js"></script>
<script>
  (async function boot() {
    // Phiên dùng chung giữa các tab (session.js): sessionStorage → localStorage
    // ("Ghi nhớ 7 ngày") → xin từ tab khác đang mở.
    let u = A3K64Session.restoreSync();
    if (!u) u = await A3K64Session.restore();

    if (!u) {
      window.location.replace('../auth/login.html');
      return;
    }

    // Nếu user vào desktop bằng thiết bị mobile → chuyển sang mobile shell
    if (window.innerWidth < 768) {
      window.location.replace('../mobile/mobile.html');
      return;
    }

    initDesktop(u);

    // Theo dõi phiên: nếu bị đăng xuất từ thiết bị khác → thông báo + buộc về trang đăng nhập
    A3K64Session.watch();
  })();

  // Đăng xuất: thu hồi token ở máy chủ + báo mọi tab khác cùng về trang đăng nhập
  window.addEventListener('a3k64-logout', () => { A3K64Session.logout(); });
</script>
<script src="../assets/js/disable-context-menu.js"></script>
</body>
</html>
