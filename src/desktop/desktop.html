<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>12A3 - Quản Lí Thi Đua</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="../assets/img/favicon.ico" />

  <!-- Preconnect GAS -->
  <link rel="preconnect" href="https://script.google.com" />
  <link rel="dns-prefetch" href="https://script.googleusercontent.com" />

  <!-- Prefetch modules hay dùng -->
  <link rel="prefetch" href="../modules/scoreboard/scoreboard-window.html" as="document" />
  <link rel="prefetch" href="../modules/scoreboard/scoreboard.js" as="script" />
  <link rel="prefetch" href="../modules/scoreboard/scoreboard.css" as="style" />

  <!-- Chỉ load CSS desktop (không kéo mobile.css) -->
  <link rel="stylesheet" href="desktop.css">
</head>
<body style="margin:0;background:#07111f">

<div id="desktop-root" class="win-root theme-dark" style="--desktop-accent:#2563eb"></div>

<!-- Config dùng chung trước -->
<script src="../assets/js/config.js"></script>
<!-- Desktop shell -->
<script src="desktop.js"></script>
<script>
  (function boot() {
    // Đọc user từ sessionStorage trước (phiên hiện tại đang mở);
    // nếu không có -> thử localStorage (chỉ tồn tại khi học sinh đã
    // tick "Ghi nhớ đăng nhập" ở trang login) và kiểm tra hạn 7 ngày.
    let u = readSessionUser();
    if (!u) u = readRememberedUser();

    if (!u) {
      window.location.replace('../auth/login.html');
      return;
    }

    // Hồi phục lại sessionStorage cho phiên làm việc hiện tại,
    // để phần còn lại của app (vốn chỉ đọc sessionStorage) hoạt động bình thường.
    sessionStorage.setItem('a3k64-user', JSON.stringify(u));

    // Nếu user vào desktop bằng thiết bị mobile → chuyển sang mobile shell
    if (window.innerWidth < 768) {
      window.location.replace('../mobile/mobile.html');
      return;
    }

    initDesktop(u);
  })();

  function readSessionUser() {
    try { return JSON.parse(sessionStorage.getItem('a3k64-user') || 'null'); }
    catch { return null; }
  }

  function readRememberedUser() {
    let u;
    try { u = JSON.parse(localStorage.getItem('a3k64-user') || 'null'); }
    catch { return null; }
    if (!u) return null;
    if (u.expiresAt && Date.now() > u.expiresAt) {
      // Hết hạn 7 ngày -> xoá và bắt đăng nhập lại
      localStorage.removeItem('a3k64-user');
      return null;
    }
    return u;
  }

  window.addEventListener('a3k64-logout', () => {
    sessionStorage.removeItem('a3k64-user');
    localStorage.removeItem('a3k64-user');
    window.location.href = '../auth/login.html';
  });
</script>
<script src="../assets/js/disable-context-menu.js"></script>
</body>
</html>
