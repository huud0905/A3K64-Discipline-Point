<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Aris — Trợ lý AI</title>
<script src="../../assets/js/session.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/js/tokens.css" />
<link rel="stylesheet" href="../../assets/css/a3k64-shared.css" />
<link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div id="cx-root"><div class="a3k-bg" aria-hidden="true"><i></i><i></i></div></div>

  <script>
    if (window.A3K64Session) {
      A3K64Session.watch();
      try {
        var ch = new BroadcastChannel('a3k64-auth');
        ch.addEventListener('message', function(e) {
          if (e.data === 'a3k64-logout' || (e.data && e.data.type === 'logout')) {
            try { window.close(); } catch (_) {}
            window.location.replace('../../auth/login.html');
          }
        });
      } catch(e) {}
    }

    // Theme + màu nhấn: đọc trước khi render để không nháy sáng — cùng key với duty/summary/settings.
    (function () {
      function readMode() {
        try {
          var raw = (localStorage.getItem('a3k64-theme') || localStorage.getItem('desktop-theme') ||
            localStorage.getItem('login-theme') || localStorage.getItem('theme-mode') || 'dark').toLowerCase();
          return ['dark', 'light', 'auto'].indexOf(raw) >= 0 ? raw : 'dark';
        } catch (e) { return 'dark'; }
      }
      function apply() {
        var mode = readMode();
        var resolved = mode === 'auto'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : mode;
        document.documentElement.setAttribute('data-theme', resolved);
        try {
          var acc = localStorage.getItem('desktop-accent') || localStorage.getItem('desktop-accent-color');
          if (acc && /^#[0-9a-f]{3,8}$/i.test(acc)) document.documentElement.style.setProperty('--desktop-accent', acc);
        } catch (e) {}
      }
      apply();
      window.addEventListener('storage', apply);
      window.addEventListener('desktop-theme-change', apply);
      window.addEventListener('appearance-change', apply);
    })();
  </script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/class-config.js"></script>
  <script src="../../assets/js/ai-proxy.js"></script>   <!-- gói đang dùng + bảng nâng cấp (A3AI) -->
  <script src="chat-skills.js"></script>   <!-- thư viện skill dựng sẵn -->
  <script src="../../assets/js/esc.js"></script>
  <script src="chat.js?v=20261119-pdf-idb"></script>  <script src="../../assets/js/touch-scroll-fix.js"></script>   <!-- iOS/Android WebView: cuộn được trong iframe -->
</body>
</html>
