<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cài đặt A3K64</title>
<style>
/* ─── Reset ─── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif}
button{font:inherit;cursor:pointer;border:none;background:none;appearance:none}
input{font:inherit}
svg{display:block;flex-shrink:0}

/* ─── Tokens ─── */
:root{
  --accent:#2563eb;
  --bg:#050914;
  --surface:#0b1220;
  --surface2:#111827;
  --border:#1f2937;
  --border2:#243044;
  --border3:#334155;
  --text:#f8fafc;
  --muted:#94a3b8;
  --muted2:#cbd5e1;
}
[data-theme="light"]{
  --bg:#f8fafc;
  --surface:#ffffff;
  --surface2:#f1f5f9;
  --border:#d7dee8;
  --border2:#d7dee8;
  --border3:#cbd5e1;
  --text:#0f172a;
  --muted:#64748b;
  --muted2:#475569;
}

/* ─── Shell ─── */
#app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%;color:var(--text);background:var(--bg);transition:background .2s,color .2s}
@media(max-width:680px){#app{grid-template-columns:1fr}}

/* ─── Sidebar ─── */
#sidebar{border-right:1px solid var(--border);padding:18px 12px;overflow-y:auto;background:var(--bg);display:flex;flex-direction:column;gap:0}
@media(max-width:680px){#sidebar{display:none}}

.sidebar-top{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-size:14px;font-weight:700;color:var(--text)}
.sidebar-top svg{color:var(--accent)}

.profile-card{display:grid;grid-template-columns:48px minmax(0,1fr);align-items:center;gap:12px;padding:12px;border:1px solid var(--border2);border-radius:14px;background:var(--surface);margin-bottom:14px}
.profile-avatar{width:48px;height:48px;border-radius:999px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),#64748b);overflow:hidden;font-weight:800;font-size:18px}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-email{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

.nav-section{margin-bottom:4px}
.nav-btn{width:100%;height:40px;display:flex;align-items:center;gap:12px;padding:0 10px;border-radius:8px;color:var(--text);font-size:14px;font-weight:500;transition:.14s ease;position:relative;text-align:left}
.nav-btn:hover,.nav-btn.active{background:var(--surface2)}
.nav-btn.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:999px;background:var(--accent)}
.nav-btn svg{color:var(--accent);opacity:.85}

/* ─── Content ─── */
#content{overflow-y:auto;padding:22px 32px 40px;background:var(--bg)}
@media(max-width:680px){#content{padding:16px 16px 40px}}

/* ─── Mobile header ─── */
.mobile-header{display:none;align-items:center;gap:10px;padding:14px 16px 4px;font-size:26px;font-weight:800;letter-spacing:-.03em}
@media(max-width:680px){.mobile-header{display:flex}}

.page-title{font-size:34px;font-weight:800;letter-spacing:-.04em;margin-bottom:20px}
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--muted);font-size:13px}
.breadcrumb button{color:var(--muted);font-size:13px;transition:color .14s}
.breadcrumb button:hover{color:var(--text)}

/* ─── Settings Card ─── */
.s-card{border:1px solid var(--border2);border-radius:18px;background:var(--surface);overflow:hidden;max-width:920px}
.s-card-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:18px;border-bottom:1px solid var(--border2)}
.s-card-head svg{color:var(--accent)}
.s-card-head h2{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-bottom:2px}
.s-card-head p{font-size:13px;color:var(--muted)}

/* ─── Nav card (grid of pages) ─── */
.nav-grid{display:grid;gap:10px;max-width:720px}
.nav-card{width:100%;min-height:68px;border:1px solid var(--border2);border-radius:14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:0 18px;text-align:left;color:var(--text);background:var(--surface);transition:.14s ease}
.nav-card:hover{background:var(--surface2);border-color:var(--border3)}
.nav-card svg{color:var(--accent)}
.nav-card strong{display:block;font-size:14px;font-weight:700}
.nav-card span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.nav-card .chevron{color:var(--muted)}

/* ─── Setting Row ─── */
.s-row{min-height:64px;border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 18px}
.s-row:last-child{border-bottom:none}
.s-row-left{display:flex;align-items:center;gap:12px;min-width:0}
.s-row-left svg{color:var(--muted);flex-shrink:0}
.s-row-left strong{display:block;font-size:14px;font-weight:600}
.s-row-left span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.s-row-right{display:flex;align-items:center;gap:10px;flex-shrink:0}

/* ─── Toggle ─── */
.toggle{width:48px;height:26px;border:1px solid var(--border3);border-radius:999px;padding:3px;background:var(--surface2);cursor:pointer;transition:.18s ease;flex-shrink:0}
.toggle span{display:block;width:18px;height:18px;border-radius:999px;background:var(--muted2);transition:transform .18s ease,background .18s ease}
.toggle.on{background:var(--accent);border-color:transparent}
.toggle.on span{transform:translateX(20px);background:#fff}

/* ─── Select ─── */
.sel-wrap{position:relative}
.sel-btn{height:38px;border:1px solid var(--border3);border-radius:10px;display:inline-flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;min-width:160px;color:var(--text);background:var(--surface2);font-size:13px;font-weight:600;transition:.14s ease}
.sel-btn:hover{border-color:var(--accent)}
.sel-menu{position:absolute;right:0;top:44px;z-index:50;min-width:190px;border:1px solid var(--border3);border-radius:12px;background:var(--surface);box-shadow:0 16px 40px rgba(0,0,0,.3);padding:6px}
.sel-menu button{width:100%;height:36px;border-radius:8px;padding:0 10px;text-align:left;color:var(--text);font-size:13px;font-weight:500;transition:.12s ease}
.sel-menu button:hover,.sel-menu button.active{background:var(--surface2)}

/* ─── Soft button ─── */
.soft-btn{height:36px;border:1px solid var(--border3);border-radius:10px;padding:0 14px;color:var(--text);background:var(--surface2);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:.14s ease}
.soft-btn:hover{border-color:var(--accent)}
.soft-btn:disabled{opacity:.45;cursor:not-allowed}

/* ─── Color section ─── */
.color-section{padding:18px;border-bottom:1px solid var(--border2)}
.color-section:last-child{border-bottom:none}
.cs-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.cs-head strong{display:block;font-size:14px;font-weight:700}
.cs-head span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.accent-chip{width:40px;height:40px;border-radius:10px;border:2px solid rgba(255,255,255,.7);flex-shrink:0;box-shadow:0 6px 18px rgba(0,0,0,.22)}
[data-theme="light"] .accent-chip{border-color:rgba(0,0,0,.18)}
.color-label{font-size:12px;font-weight:800;color:var(--muted2);margin:0 0 8px}
.color-swatches{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.color-swatches button{width:34px;height:34px;border:1px solid rgba(255,255,255,.18);border-radius:8px;color:#fff;display:grid;place-items:center;font-size:14px;transition:.14s ease}
[data-theme="light"] .color-swatches button{border-color:rgba(0,0,0,.15)}
.color-swatches button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.color-swatches button.active{box-shadow:0 0 0 2px #fff,0 6px 14px rgba(0,0,0,.3)}
[data-theme="light"] .color-swatches button.active{box-shadow:0 0 0 2px #0f172a,0 6px 14px rgba(0,0,0,.15)}
.custom-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:14px;border-top:1px solid var(--border2)}
.custom-row strong{display:block;font-size:14px;font-weight:700}
.custom-row span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.custom-color-input{width:42px;height:42px;border:none;border-radius:10px;background:transparent;cursor:pointer;padding:0}

/* ─── About box ─── */
.about-box{padding:22px 18px;display:grid;gap:8px}
.about-box strong{font-size:18px;font-weight:800}
.about-box span{font-size:13px;color:var(--muted)}

/* ─── Background preview ─── */
.bg-preview{height:150px;margin:18px;border:1px solid var(--border3);border-radius:14px;display:grid;place-items:center;position:relative;overflow:hidden;
  background:radial-gradient(circle at 30% 20%,var(--accent),transparent 28%),linear-gradient(135deg,#111827,#020617)}
[data-theme="light"] .bg-preview{background:radial-gradient(circle at 30% 20%,var(--accent),transparent 28%),linear-gradient(135deg,#e2e8f0,#f1f5f9)}
.bg-preview span{font-weight:700;font-size:13px;color:var(--muted2)}

/* ─── Taskbar group ─── */
.tb-group{border-bottom:1px solid var(--border2)}
.tb-group:last-child{border-bottom:none}
.tb-group-head{padding:16px 18px 4px}
.tb-group-head strong{display:block;font-size:13px;font-weight:800}
.tb-group-head span{display:block;font-size:12px;color:var(--muted);margin-top:3px}

/* ─── Transitions / hidden ─── */
.page{display:none}
.page.active{display:block}
.anim-in{animation:fadeSlideIn .16s ease both}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="app">
  <!-- ── Sidebar ── -->
  <aside id="sidebar">
    <div class="sidebar-top">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
      Cài đặt
    </div>

    <div class="profile-card" id="sb-profile">
      <div class="profile-avatar" id="sb-avatar">A3</div>
      <div>
        <div class="profile-name" id="sb-name">Người dùng 12A3</div>
        <div class="profile-email" id="sb-email">Đang đăng nhập</div>
      </div>
    </div>

    <nav class="nav-section" id="sidebar-nav">
      <!-- injected by JS -->
    </nav>
  </aside>

  <!-- ── Main content ── -->
  <main id="content">
    <!-- Page: Home (mobile) / Personalization root -->
    <div class="page active" id="page-home">
      <div class="mobile-header">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        Cài đặt
      </div>
      <div class="page-title">Cá nhân hóa</div>
      <div class="nav-grid" id="home-nav-grid"><!-- injected --></div>
    </div>

    <!-- Page: Color -->
    <div class="page" id="page-color"></div>

    <!-- Page: Background -->
    <div class="page" id="page-background"></div>

    <!-- Page: Taskbar -->
    <div class="page" id="page-taskbar"></div>

    <!-- Page: Display -->
    <div class="page" id="page-display"></div>

    <!-- Page: About -->
    <div class="page" id="page-about"></div>

    <!-- Page: System -->
    <div class="page" id="page-system"></div>
  </main>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   SETTINGS WINDOW — vanilla JS, no build, no framework
   ═══════════════════════════════════════════════════════ */

// ─── helpers ─────────────────────────────────────────
const $ = (s, ctx = document) => ctx.querySelector(s);
const $$ = (s, ctx = document) => [...ctx.querySelectorAll(s)];

const ls = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, String(v)); } catch {} },
  json: k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } },
};

function svg(path, size = 20) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
}

const ICONS = {
  palette: `<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c1.1 0 2-.9 2-2 0-.53-.21-1.01-.54-1.37-.31-.33-.5-.77-.5-1.26 0-.97.78-1.37 1.37-1.37H16c2.76 0 5-2.24 5-5 0-4.97-4.03-9-9-9z"/><circle cx="6.5" cy="11.5" r="1.5"/><circle cx="9.5" cy="7.5" r="1.5"/><circle cx="14.5" cy="7.5" r="1.5"/><circle cx="17.5" cy="11.5" r="1.5"/>`,
  wallpaper: `<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>`,
  monitor: `<rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>`,
  info: `<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>`,
  settings: `<circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>`,
  chevronRight: `<path d="m9 18 6-6-6-6"/>`,
  chevronLeft: `<path d="m15 18-6-6 6-6"/>`,
  check: `<path d="M20 6 9 17l-5-5"/>`,
  search: `<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>`,
  upload: `<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>`,
  sparkles: `<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3z"/>`,
};

// ─── Accent management ───────────────────────────────
const PRESET_ACCENTS = {
  blue: '#2563eb', violet: '#7c3aed', pink: '#db2777',
  green: '#059669', amber: '#d97706', red: '#dc2626',
};

const SWATCH_PALETTE = [
  '#fbbf24','#fb923c','#f97316','#ea580c','#dc2626','#ef4444','#f43f5e','#e11d48',
  '#0ea5e9','#0284c7','#6366f1','#8b5cf6','#a855f7','#9333ea','#06b6d4','#0891b2',
  '#14b8a6','#10b981','#059669','#16a34a','#15803d','#64748b','#52525b','#78716c',
];

function normalizeHex(v) {
  if (!v) return null;
  const raw = v.trim();
  if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(raw)) {
    const body = raw.slice(1);
    return body.length === 3
      ? '#' + body.split('').map(x => x + x).join('')
      : raw.toLowerCase();
  }
  return PRESET_ACCENTS[raw.toLowerCase()] || null;
}

function readAccent() {
  const keys = ['desktop-accent','desktop-accent-color','login-accent-color','accent-color','login-custom-accent','custom-accent'];
  for (const k of keys) {
    const c = normalizeHex(ls.get(k));
    if (c) return c;
  }
  return PRESET_ACCENTS.blue;
}

function saveAccent(color) {
  const normalized = normalizeHex(color) || PRESET_ACCENTS.blue;
  const match = Object.entries(PRESET_ACCENTS).find(([,v]) => v === normalized);
  const key = match ? match[0] : 'custom';
  const storage = {
    'desktop-accent': normalized, 'desktop-accent-color': normalized,
    'desktop-custom-accent': normalized, 'login-accent': key,
    'login-accent-color': normalized, 'login-custom-accent': normalized,
    'custom-accent': normalized, 'customAccent': normalized,
    'accent-color': normalized, 'accent': key,
  };
  for (const [k, v] of Object.entries(storage)) ls.set(k, v);
  document.documentElement.style.setProperty('--accent', normalized);
  // Tell parent desktop
  try { window.parent.document.documentElement.style.setProperty('--desktop-accent', normalized); } catch {}
  window.dispatchEvent(new Event('accent-change'));
  window.dispatchEvent(new Event('appearance-change'));
  return normalized;
}

// ─── Theme management ────────────────────────────────
const THEME_LABELS = { dark: 'Tối', light: 'Sáng', auto: 'Tự động' };

function readTheme() {
  const raw = (ls.get('desktop-theme') || ls.get('login-theme') || ls.get('theme-mode') || 'dark').toLowerCase();
  return ['dark','light','auto'].includes(raw) ? raw : 'dark';
}

function applyTheme(mode) {
  const resolved = mode === 'auto'
    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : mode;
  document.documentElement.setAttribute('data-theme', resolved);
  // QUAN TRỌNG: phải ghi cả 'a3k64-theme' — desktop.js đọc theme ưu tiên
  // đúng key này trước tiên (readTheme() trong desktop.js). Trước đây
  // danh sách này thiếu 'a3k64-theme' nên desktop.js luôn đọc ra giá trị
  // CŨ của 'a3k64-theme' (không đổi theo), khiến bấm "Sáng" ở Cài đặt
  // không hề làm cả hệ thống (desktop + các app nhúng qua iframe) sáng lên.
  ['desktop-theme','login-theme','login-theme-mode','theme-mode','theme','a3k64-theme'].forEach(k => ls.set(k, mode));
  // data-theme trên <html> của desktop.html không được desktop.css dùng
  // (nó style theo class .theme-light trên #desktop-root) — dòng dưới chỉ
  // giữ lại cho tương thích ngược, không phải nguồn sự thật.
  try { window.parent.document.documentElement.setAttribute('data-theme', resolved); } catch {}
  // Đồng bộ NGAY cho desktop cha thay vì chờ sự kiện 'storage' (đề phòng
  // trình duyệt trì hoãn hoặc không bắn sự kiện 'storage' trong 1 số case).
  try {
    const p = window.parent;
    if (p && p !== window && typeof p.readTheme === 'function' && typeof p.applyThemeClass === 'function') {
      p.resolvedTheme = p.readTheme();
      p.applyThemeClass();
    }
  } catch {}
  window.dispatchEvent(new Event('desktop-theme-change'));
  window.dispatchEvent(new Event('appearance-change'));
}

// ─── Taskbar settings ────────────────────────────────
const DEFAULT_TB = { searchMode:'box', taskView:true, widgets:false, resume:true, alignment:'center', autoHide:false, badges:true };

function readTB() { return { ...DEFAULT_TB, ...(ls.json('taskbar-settings') || {}) }; }

function saveTB(settings) {
  ls.set('taskbar-settings', JSON.stringify(settings));
  window.dispatchEvent(new CustomEvent('taskbar-settings-change', { detail: settings }));
  try { window.parent.dispatchEvent(new CustomEvent('taskbar-settings-change', { detail: settings })); } catch {}
}

// ─── User ────────────────────────────────────────────
function readUser() {
  try { return JSON.parse(sessionStorage.getItem('a3k64-user') || 'null'); } catch { return null; }
}

// ─── State ───────────────────────────────────────────
let currentPage = 'home';
let accent = readAccent();
let theme = readTheme();
let tb = readTB();
let recentAccents = (() => { try { return JSON.parse(ls.get('recent-accents') || '[]'); } catch { return []; } })();

// ─── Navigation ──────────────────────────────────────
const PAGES = [
  { id:'home', label:'Cá nhân hóa', icon:'palette', parent:null },
  { id:'system', label:'Hệ thống', icon:'settings', parent:null },
  { id:'color', label:'Màu sắc', icon:'palette', parent:'home' },
  { id:'background', label:'Hình nền', icon:'wallpaper', parent:'home' },
  { id:'taskbar', label:'Thanh taskbar', icon:'monitor', parent:'home' },
  { id:'display', label:'Màn hình', icon:'monitor', parent:'system' },
  { id:'about', label:'Giới thiệu', icon:'info', parent:'system' },
];

function navigate(id) {
  $$('.page').forEach(el => el.classList.remove('active'));
  const el = $(`#page-${id}`);
  if (el) { el.classList.add('active'); el.classList.add('anim-in'); setTimeout(() => el.classList.remove('anim-in'), 300); }
  currentPage = id;

  // render page content each time to stay fresh
  renderPageContent(id);

  // sidebar active state
  $$('#sidebar-nav .nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.page === id || btn.dataset.page === PAGES.find(p=>p.id===id)?.parent);
  });
}

// ─── Sidebar build ───────────────────────────────────
function buildSidebar() {
  const user = readUser();
  if (user) {
    const av = $('#sb-avatar');
    if (user.photoURL) { av.innerHTML = `<img src="${user.photoURL}" alt="Avatar">`; }
    else { av.textContent = (user.displayName || 'A3').charAt(0).toUpperCase(); }
    $('#sb-name').textContent = user.displayName || 'Người dùng 12A3';
    $('#sb-email').textContent = user.email || user.role || 'Đang đăng nhập';
  }

  const nav = $('#sidebar-nav');
  const topPages = [
    { id:'home', icon:'palette', label:'Cá nhân hóa' },
    { id:'system', icon:'settings', label:'Hệ thống' },
  ];
  nav.innerHTML = topPages.map(p => `
    <button class="nav-btn" data-page="${p.id}" onclick="navigate('${p.id}')">
      ${svg(ICONS[p.icon], 18)} ${p.label}
    </button>`).join('');
}

// ─── Page renderers ──────────────────────────────────
function renderPageContent(id) {
  const el = $(`#page-${id}`);
  if (!el) return;

  if (id === 'home') { renderHome(); return; }
  if (id === 'system') { renderSystem(); return; }
  if (id === 'color') { renderColor(el); return; }
  if (id === 'background') { renderBackground(el); return; }
  if (id === 'taskbar') { renderTaskbar(el); return; }
  if (id === 'display') { renderDisplay(el); return; }
  if (id === 'about') { renderAbout(el); return; }
}

function breadcrumb(parentLabel, parentId, currentLabel) {
  return `<div class="breadcrumb">
    <button onclick="navigate('${parentId}')">${parentLabel}</button>
    ${svg(ICONS.chevronRight, 16)}
    <span>${currentLabel}</span>
  </div>`;
}

function renderHome() {
  const el = $('#home-nav-grid');
  el.innerHTML = [
    { id:'background', icon:'wallpaper', label:'Hình nền', sub:'Ảnh nền desktop' },
    { id:'color', icon:'palette', label:'Màu sắc', sub:'Màu chủ đạo và chế độ giao diện' },
    { id:'taskbar', icon:'monitor', label:'Thanh taskbar', sub:'Căn chỉnh và hành vi' },
  ].map(p => `
    <button class="nav-card" onclick="navigate('${p.id}')">
      ${svg(ICONS[p.icon], 22)}
      <div><strong>${p.label}</strong><span>${p.sub}</span></div>
      <span class="chevron">${svg(ICONS.chevronRight, 18)}</span>
    </button>`).join('');
}

function renderSystem() {
  const el = $('#page-system');
  el.innerHTML = `
    <div class="page-title">Hệ thống</div>
    <div class="nav-grid">
      ${[
        { id:'display', icon:'monitor', label:'Màn hình', sub:'Tỷ lệ và bố cục hiển thị' },
        { id:'about', icon:'info', label:'Giới thiệu', sub:'Thông tin ứng dụng' },
      ].map(p => `
        <button class="nav-card" onclick="navigate('${p.id}')">
          ${svg(ICONS[p.icon], 22)}
          <div><strong>${p.label}</strong><span>${p.sub}</span></div>
          <span class="chevron">${svg(ICONS.chevronRight, 18)}</span>
        </button>`).join('')}
    </div>`;
}

      </div>

        <div class="s-row-left">${svg(ICONS.monitor,18)}<div><strong>Chế độ giao diện</strong><span>Đổi giữa Tối, Sáng hoặc theo hệ thống.</span></div></div>
        <div class="s-row-right">
          <div class="sel-wrap" id="theme-sel-wrap">

      </div>

      <div class="s-row">

        </div>
        <div class="custom-row">
          <div><strong>Màu tùy chỉnh</strong><span>Chọn bất kỳ màu nào bằng bảng chọn màu.</span></div>
          <div style="display:flex;align-items:center;gap:10px">
            <input type="color" class="custom-color-input" value="${accent}" oninput="applyAccentUI(this.value)" title="Chọn màu tùy chỉnh"/>

        <div class="s-row-left"><div><strong>Hiện màu trên Start và taskbar</strong></div></div>
        <div class="s-row-right">
          <button class="toggle ${ls.get('accent-taskbar')==='on'?'on':''}" onclick="toggleLS(this,'accent-taskbar','on','off')"><span></span></button>

function renderDisplay(el) {
  const SCALE_OPTS = [75,80,90,100,110,125,150,175,200];

  el.innerHTML = `
    ${breadcrumb('Hệ thống','system','Màn hình')}
    <div class="s-card">
      <div class="s-card-head">
        ${svg(ICONS.monitor, 20)}
        <div><h2>Màn hình</h2><p>Tỷ lệ và bố cục hiển thị giao diện.</p></div>
      </div>
      <div class="s-row">
        <div class="s-row-left">${svg(ICONS.monitor,18)}<div><strong>Tỷ lệ và bố cục</strong><span>Thay đổi kích thước chữ và ứng dụng.</span></div></div>
        <div class="s-row-right">
          <select style="height:38px;border:1px solid var(--border3);border-radius:10px;padding:0 12px;color:var(--text);background:var(--surface2);font:inherit;font-size:13px;font-weight:700;cursor:pointer;outline:none" onchange="applyScale(+this.value)">
            ${SCALE_OPTS.map(s=>`<option value="${s}" ${s===savedScale?'selected':''}>${s}%${s===100?' (Mặc định)':''}</option>`).join('')}
          </select>

      </div>

function renderAbout(el) {
  el.innerHTML = `
    ${breadcrumb('Hệ thống','system','Giới thiệu')}
    <div class="s-card">
      <div class="s-card-head">
        ${svg(ICONS.info, 20)}
        <div><h2>Giới thiệu</h2><p>Thông tin ứng dụng quản lý thi đua.</p></div>
      </div>
      <div class="about-box">
        <strong>12A3 – Quản lý Thi Đua</strong>
        <span>Phiên bản web nội bộ A3K64.</span>
        <span>Đăng nhập bằng Google, phân quyền theo ACCOUNTS và đồng bộ cá nhân hoá qua localStorage.</span>
        <span style="margin-top:4px;color:var(--accent);font-weight:700">A3K64 © 2025</span>
      </div>
    </div>`;
}

// ─── UI helpers ──────────────────────────────────────
function toggleSel(wrapId) {
  const wrap = $(`#${wrapId}`);
  if (!wrap) return;
  const menu = wrap.querySelector('.sel-menu');
  const isOpen = menu.style.display !== 'none';
  closeSels();
  if (!isOpen) menu.style.display = 'block';
}

function closeSels() {
  $$('.sel-menu').forEach(m => m.style.display = 'none');
}

document.addEventListener('click', e => {
  if (!e.target.closest('.sel-wrap')) closeSels();
});

function toggleLS(btn, key, onVal, offVal) {
  const isOn = btn.classList.toggle('on');
  ls.set(key, isOn ? onVal : offVal);
}

function applyAccentUI(color) {
  const norm = saveAccent(color);
  accent = norm;
  // update chip
  const chip = $('#accent-chip');
  if (chip) chip.style.background = norm;
  // update swatches
  $$('#palette-swatches button').forEach((btn, i) => {
    const c = SWATCH_PALETTE[i];
    btn.classList.toggle('active', c.toLowerCase() === norm.toLowerCase());
    btn.innerHTML = c.toLowerCase() === norm.toLowerCase() ? svg(ICONS.check, 16) : '';
  });
  $$('#recent-swatches button').forEach(btn => {
    const c = btn.style.background;
    const hex = rgbToHex(c) || c;
    btn.innerHTML = hex.toLowerCase() === norm.toLowerCase() ? svg(ICONS.check, 16) : '';
  });
  // update recent list
  recentAccents = [norm, ...recentAccents.filter(c => c.toLowerCase() !== norm.toLowerCase())].slice(0, 4);
  ls.set('recent-accents', JSON.stringify(recentAccents));
}

function rgbToHex(rgb) {
  const m = rgb.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
  if (!m) return null;
  return '#' + [m[1],m[2],m[3]].map(n => (+n).toString(16).padStart(2,'0')).join('');
}

function applyThemeUI(mode) {
  theme = mode;
  applyTheme(mode);
  // re-render color page
  const el = $('#page-color');
  if (el && el.classList.contains('active')) renderColor(el);
  else renderColor(el); // refresh anyway for label
  const label = $('#theme-label');
  if (label) label.textContent = THEME_LABELS[mode];
}

function updateTB(key, value) {
  tb[key] = value;
  saveTB(tb);
}

function updateTBToggle(btn, key) {
  const isOn = btn.classList.toggle('on');
  updateTB(key, isOn);
}

function applyScale(scale) {
  ls.set('a3k64-display-scale', scale);
  const ratio = scale / 100;
  try {
    const root = window.parent.document.documentElement;
    root.style.setProperty('--a3-display-scale', ratio);
    root.style.zoom = `${scale}%`;
  } catch {}
  document.documentElement.style.zoom = `${scale}%`;
  window.dispatchEvent(new CustomEvent('a3k64-display-scale-change', { detail: { scale } }));
}

// ─── Listen for external changes ─────────────────────
window.addEventListener('storage', () => {
  accent = readAccent();
  theme = readTheme();
  document.documentElement.style.setProperty('--accent', accent);
  applyTheme(theme);
});

// ─── Boot ────────────────────────────────────────────
(function boot() {
  // Sync accent & theme from parent/storage
  accent = readAccent();
  theme = readTheme();
  document.documentElement.style.setProperty('--accent', accent);
  applyTheme(theme);

  buildSidebar();
  renderHome();
  renderSystem();

  // mobile: add sidebar items to home
  const mobileExtra = document.createElement('div');
  mobileExtra.style.cssText = 'margin-top:20px';
  mobileExtra.innerHTML = `<div class="color-label" style="margin:16px 0 8px">Hệ thống</div>
    <div class="nav-grid">
      ${[
        { id:'display', icon:'monitor', label:'Màn hình', sub:'Tỷ lệ và bố cục' },
        { id:'about', icon:'info', label:'Giới thiệu', sub:'Thông tin ứng dụng' },
      ].map(p=>`<button class="nav-card" onclick="navigate('${p.id}')">${svg(ICONS[p.icon],22)}<div><strong>${p.label}</strong><span>${p.sub}</span></div><span class="chevron">${svg(ICONS.chevronRight,18)}</span></button>`).join('')}
    </div>`;
  $('#home-nav-grid').after(mobileExtra);
})();
</script>
