<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Games</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="games.css"/>
</head>
<body>
  <div id="games-root" class="games-root">

    <!-- Màn hình chọn game -->
    <div id="games-hub" class="games-hub">
      <header class="games-hub-header">
        <h1>🎮 Games</h1>
        <p>Chọn một trò chơi để bắt đầu</p>
      </header>
      <div class="games-grid" id="games-grid"></div>
    </div>

    <!-- Khung chạy game đã chọn -->
    <div id="games-player" class="games-player" style="display:none">
      <div class="games-player-bar">
        <button class="games-back-btn" onclick="closeGame()">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Games
        </button>
        <span class="games-player-title" id="games-player-title"></span>
      </div>
      <iframe id="games-player-frame" class="games-player-frame" title="game"></iframe>
    </div>

  </div>

  <script src="games.js"></script>
</body>
</html>
