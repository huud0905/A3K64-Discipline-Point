<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trực nhật — 12A3</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="duty.css" />
<style>
  html, body { height:100%; margin:0; padding:0; }
  #duty-root { height:100%; }
</style>
</head>
<body>
  <div id="duty-root"></div>

  <script>
    // Theme: đọc trước khi render để không nháy sáng — cùng key với seating/settings.
    (function () {
      function readMode() {
        try {
          const raw = (localStorage.getItem('a3k64-theme') || localStorage.getItem('desktop-theme') ||
            localStorage.getItem('login-theme') || localStorage.getItem('theme-mode') || 'dark').toLowerCase();
          return ['dark', 'light', 'auto'].includes(raw) ? raw : 'dark';
        } catch (e) { return 'dark'; }
      }
      function apply() {
        const mode = readMode();
        const resolved = mode === 'auto'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : mode;
        document.documentElement.setAttribute('data-theme', resolved);
      }
      apply();
      window.addEventListener('storage', apply);
      window.addEventListener('desktop-theme-change', apply);
      window.addEventListener('appearance-change', apply);
    })();
  </script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/notify.js"></script>
  <script src="duty.js"></script>
</body>
</html>
