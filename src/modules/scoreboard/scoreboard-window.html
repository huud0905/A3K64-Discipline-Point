<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng điểm A3K64</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="scoreboard.css" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: #07111f; color: #f8fafc; }
    #scoreboard-root { min-height: 100%; }
  </style>
</head>
<body>
  <div id="scoreboard-root"></div>

  <!--
    Ngăn scoreboard.js tự khởi động — boot được thực hiện thủ công
    sau khi cấu hình accent/user đã được đọc xong.
  -->
  <script>window.__scoreboard_manual_init = true;</script>

  <script src="../../assets/js/config.js"></script>
  <script src="scoreboard.js"></script>
  <script src="scoreboard-extras.js"></script>
  <script src="scoreboard-modal.js"></script>
  <script src="scoreboard-ai.js"></script>
  <script src="scoreboard-animations.js"></script>


  <script>
    /* ============================================================
       CONSTANTS
       ============================================================ */

    /** Các màu accent có sẵn theo tên ngắn. */
    const ACCENT_PRESETS = {
      blue:   '#2563eb',
      violet: '#7c3aed',
      pink:   '#db2777',
      green:  '#059669',
      amber:  '#d97706',
      red:    '#dc2626',
    };

    /** Màu accent mặc định khi không tìm được cấu hình. */
    const DEFAULT_ACCENT = ACCENT_PRESETS.blue;

    /**
     * Các key localStorage được ứng dụng desktop/login sử dụng để lưu
     * màu accent. Tra theo thứ tự ưu tiên giảm dần.
     */
    const ACCENT_STORAGE_KEYS = [
      'login-accent',
      'accent-color',
      'accent',
      'desktop-accent',
      'a3k64-accent',
    ];

    /** Key sessionStorage chứa thông tin user đã đăng nhập. */
    const SESSION_USER_KEY = 'a3k64-user';

    /**
     * Map role thô (từ session) → role chuẩn nội bộ của scoreboard.
     * Các role không khớp được fallback về 'hoc_sinh'.
     */
    const ROLE_MAP = {
      student:   'hoc_sinh',
      admin:     'gvcn',
      gvcn:      'gvcn',
      hoc_sinh:  'hoc_sinh',
      to_truong: 'to_truong',
      lop_truong:'lop_truong',
      bi_thu:    'bi_thu',
    };

    const FALLBACK_ROLE = 'hoc_sinh';

    /* ============================================================
       HELPERS
       ============================================================ */

    /**
     * Kiểm tra chuỗi có phải mã màu HEX hợp lệ không (#rgb hoặc #rrggbb).
     * @param {string} value
     * @returns {boolean}
     */
    function isValidHexColor(value) {
      return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(value.trim());
    }

    /**
     * Chuyển một giá trị accent thô (tên preset hoặc mã HEX) thành mã HEX.
     * Trả về null nếu không hợp lệ.
     * @param {string|null|undefined} rawValue
     * @returns {string|null}
     */
    function resolveAccentColor(rawValue) {
      if (!rawValue) return null;
      const trimmed = rawValue.trim();
      if (isValidHexColor(trimmed)) return trimmed;
      return ACCENT_PRESETS[trimmed.toLowerCase()] ?? null;
    }

    /**
     * Đọc màu accent từ danh sách key localStorage theo thứ tự ưu tiên.
     * Trả về màu mặc định nếu không tìm thấy giá trị hợp lệ.
     * @returns {string} Mã màu HEX
     */
    function readAccentFromStorage() {
      for (const key of ACCENT_STORAGE_KEYS) {
        try {
          const resolved = resolveAccentColor(localStorage.getItem(key));
          if (resolved) return resolved;
        } catch {
          // localStorage có thể bị chặn trong một số trình duyệt (private mode)
        }
      }
      return DEFAULT_ACCENT;
    }

    /**
     * Chuẩn hóa role thô về role hợp lệ cho scoreboard.
     * @param {string|null|undefined} rawRole
     * @returns {string}
     */
    function normalizeRole(rawRole) {
      const key = String(rawRole ?? '').trim().toLowerCase();
      return ROLE_MAP[key] ?? FALLBACK_ROLE;
    }

    /**
     * Đọc thông tin user từ sessionStorage.
     * Trả về null nếu không có hoặc JSON không hợp lệ.
     * @returns {object|null}
     */
    function readSessionUser() {
      try {
        const raw = sessionStorage.getItem(SESSION_USER_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (err) {
        console.warn('[Scoreboard] Không đọc được session user:', err);
        return null;
      }
    }

    /**
     * Áp dụng màu accent lên CSS custom properties của document root.
     * @param {string} accent Mã màu HEX
     */
    function applyAccentToDocument(accent) {
      const root = document.documentElement;
      root.style.setProperty('--desktop-accent', accent);
      root.style.setProperty('--accent', accent);
    }

    /* ============================================================
       BOOT
       ============================================================ */

    /**
     * Đọc theme từ localStorage (đồng bộ với settings-window.html).
     * Trả về 'light' hoặc 'dark'.
     */
    function readThemeMode() {
      try {
        const raw = (
          localStorage.getItem('desktop-theme') ||
          localStorage.getItem('login-theme')   ||
          localStorage.getItem('theme-mode')    ||
          localStorage.getItem('a3k64-theme')   ||
          'dark'
        ).toLowerCase();
        const map = { light:'light', sang:'light', sáng:'light', dark:'dark', toi:'dark', tối:'dark' };
        const mode = map[raw] || 'dark';
        if (mode === 'auto' || raw === 'auto') {
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        return mode;
      } catch { return 'dark'; }
    }

    /** Áp dụng data-theme lên <html> để scoreboard.css kích hoạt token đúng. */
    function applyTheme(mode) {
      document.documentElement.setAttribute('data-theme', mode);
    }

    // Lắng nghe khi desktop/settings đổi theme — sync ngay vào iframe này
    const THEME_KEYS = new Set(['desktop-theme','login-theme','theme-mode','a3k64-theme','login-theme-mode','theme']);
    window.addEventListener('storage', (e) => {
      if (e.key && !THEME_KEYS.has(e.key)) return;
      applyTheme(readThemeMode());
    });

    // Lắng nghe custom event từ parent (desktop.js broadcast qua postMessage)
    window.addEventListener('message', (e) => {
      if (e.data?.type === 'a3k64-theme-change') {
        applyTheme(e.data.theme || readThemeMode());
      }
    });

    /**
     * Khởi động scoreboard sau khi đọc cấu hình từ storage.
     * Bắt toàn bộ lỗi để tránh crash trang trắng hoàn toàn.
     */
    (function boot() {
      // 0. Theme — phải set trước khi render để tránh flash
      applyTheme(readThemeMode());
      const accent = readAccentFromStorage();
      applyAccentToDocument(accent);

      // 2. User session
      const user      = readSessionUser();
      const userRole  = normalizeRole(user?.role);
      const userGroup = user?.group ?? user?.to ?? null;

      // 3. GAS URL từ config toàn cục (được inject bởi config.js)
      const gasUrl = window.A3K64_CONFIG?.gasUrl ?? null;

      // 4. Gọi initScoreboard — hàm này được export bởi scoreboard.js
      try {
        if (typeof initScoreboard !== 'function') {
          throw new ReferenceError('initScoreboard không được tìm thấy. Kiểm tra scoreboard.js đã tải chưa.');
        }
        initScoreboard({ userRole, userGroup, gasUrl });
      } catch (err) {
        console.error('[Scoreboard] Lỗi khi khởi động:', err);
        // Hiển thị thông báo lỗi đơn giản thay vì trang trắng
        const root = document.getElementById('scoreboard-root');
        if (root) {
          root.innerHTML = `
            <div style="
              display:flex; flex-direction:column; align-items:center; justify-content:center;
              min-height:100vh; gap:12px; color:#f87171; font-family:system-ui,sans-serif;
              text-align:center; padding:24px;
            ">
              <strong style="font-size:18px;">Không thể khởi động bảng điểm</strong>
              <span style="font-size:13px; color:#94a3b8; max-width:380px; line-height:1.5;">
                ${err.message ?? 'Lỗi không xác định. Vui lòng tải lại trang.'}
              </span>
            </div>`;
        }
      }
    })();
  </script>

  <script src="../../assets/js/disable-context-menu.js"></script>
</body>
</html>
