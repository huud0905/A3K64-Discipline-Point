<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quản trị</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="admin.css" />
<style>html,body{height:100%;margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div id="ad-root" class="ad-root"></div>
<script>
  // Theme + màu nhấn: cùng khoá với các module khác, đọc trước khi vẽ để không nháy sáng.
  (function () {
    function apply() {
      var raw = 'dark';
      try { raw = (localStorage.getItem('a3k64-theme') || localStorage.getItem('desktop-theme') || localStorage.getItem('theme-mode') || 'dark').toLowerCase(); } catch (e) {}
      var m = ['dark', 'light', 'auto'].indexOf(raw) >= 0 ? raw : 'dark';
      var r = m === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : m;
      document.documentElement.setAttribute('data-theme', r);
      try { var a = localStorage.getItem('desktop-accent'); if (a && /^#[0-9a-f]{3,8}$/i.test(a)) document.documentElement.style.setProperty('--desktop-accent', a); } catch (e) {}
    }
    apply(); window.addEventListener('storage', apply);
  })();
</script>
<script src="../../assets/js/config.js"></script>
<script src="admin.js"></script>
</body>
</html>
