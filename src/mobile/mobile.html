<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>12A3 - Quản Lí Thi Đua</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Preconnect GAS -->
  <link rel="preconnect" href="https://script.google.com" />
  <link rel="dns-prefetch" href="https://script.googleusercontent.com" />

  <!-- Chỉ load CSS mobile (không kéo desktop.css nặng) -->
  <link rel="stylesheet" href="mobile.css">
</head>
<body style="margin:0;background:#07111f">

<div id="desktop-root" class="win-root theme-dark" style="--desktop-accent:#2563eb"></div>

<!-- Config dùng chung trước -->
<script src="../assets/js/config.js"></script>
<!-- Desktop core (chứa helpers: icons, APPS, state, theme...) -->
<script src="../desktop/desktop.js"></script>
<!-- Mobile shell override -->
<script src="mobile.js"></script>
<script>
  (function boot() {
    // Đọc user từ sessionStorage trước; nếu không có -> thử localStorage
    // (chỉ tồn tại khi học sinh tick "Ghi nhớ đăng nhập" ở trang login),
    // kiểm tra hạn 7 ngày. Cùng logic với desktop/desktop.html để 2 shell
    // luôn đồng bộ hành vi phiên đăng nhập.
    let u = readSessionUser();
    if (!u) u = readRememberedUser();

    if (!u) {
      window.location.replace('../auth/login.html');
      return;
    }

    // Hồi phục sessionStorage cho phiên hiện tại
    sessionStorage.setItem('a3k64-user', JSON.stringify(u));

    // Nếu user mở trên PC → chuyển sang desktop shell
    // (so cạnh nhỏ hơn giữa width/height để không bị nhầm khi điện
    // thoại đang ở chế độ ngang lúc load trang)
    if (Math.min(window.innerWidth, window.innerHeight) >= 768 && !/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) {
      window.location.replace('../desktop/desktop.html');
      return;
    }

    // Khởi động mobile shell
    initDesktop(u);
  })();

  function readSessionUser() {
    try { return JSON.parse(sessionStorage.getItem('a3k64-user') || 'null'); }
    catch { return null; }
  }

  function readRememberedUser() {
    let u;
    try { u = JSON.parse(localStorage.getItem('a3k64-user') || 'null'); }
    catch { return null; }
    if (!u) return null;
    if (u.expiresAt && Date.now() > u.expiresAt) {
      localStorage.removeItem('a3k64-user');
      return null;
    }
    return u;
  }

  window.addEventListener('a3k64-logout', () => {
    sessionStorage.removeItem('a3k64-user');
    localStorage.removeItem('a3k64-user');
    window.location.href = '../auth/login.html';
  });
</script>
  <script src="../assets/js/disable-context-menu.js"></script>
  <script src="../assets/js/touch-scroll-fix.js"></script>
</body>
</html>
