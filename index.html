<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A3K64</title>
  <style>
    body { margin: 0; background: #07111f; }
  </style>
</head>
<body>
<script src="src/assets/js/disable-context-menu.js"></script>
<script>
  // Phát hiện thiết bị → điều hướng đúng shell
  (function detect() {
    const isMobile = window.innerWidth < 768 ||
      /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

    if (isMobile) {
      window.location.replace('src/mobile/mobile.html');
    } else {
      window.location.replace('src/desktop/desktop.html');
    }
  })();
</script>
</body>
</html>
